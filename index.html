<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧠 MindHunt - A Brain Teaser</title>
  <link rel="stylesheet" href="GuessGame.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
</head>
<body>
  <div class="background-animation"></div>

  <main class="game-container">
    <header class="game-header">
      <h1 class="game-title">🧠 MindHunt - A Brain Teaser</h1>
      <p class="game-subtitle">Think Fast. Guess Smart.</p>
    </header>

    <div class="game-card">
      <select id="difficulty" class="guess-input">
        <option value="50">Easy</option>
        <option value="100">Medium</option>
        <option value="500">Hard</option>
      </select>

      <div class="stat-container">
        <div class="stat-item">
          <span class="stat-label">Time</span>
          <span class="stat-value" id="timer">60</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Streak</span>
          <span class="stat-value" id="streak">0</span>
        </div>
      </div>

      <div class="progress">
        <div id="progressBar"></div>
      </div>

      <div class="input-section">
        <div class="input-wrapper">
          <input type="number" id="guessInput" class="guess-input" placeholder="Enter your guess..." min="0" max="100" autocomplete="off">
          <button id="submitBtn" class="submit-btn" onclick="checkGuess()">
            🚀 Fire Guess
          </button>
        </div>
      </div>

      <div class="feedback-section">
        <div id="message" class="message"></div>
        <div class="stats-container">
          <div class="stat-item">
            <span class="stat-label">Attempts</span>
            <span class="stat-value" id="attempts">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Score</span>
            <span class="stat-value" id="score">100</span>
          </div>
        </div>
      </div>

      <div class="action-section">
        <button id="restartBtn" class="restart-btn" onclick="restartGame()">
          🔄️ Hunt Again
        </button>
        <button id="hintBtn" class="hint-btn" onclick="getHint()">
          💡Reveal Clue
        </button>
      </div>
    </div>

    <div class="game-info">
      <div class="info-item">
        <span class="info-text">📜 Guess History</span>
      </div>
      <ul id="history"></ul>

      <div class="info-item">
        <span class="info-text">🏆 Leaderboard:</span>
      </div>
      <ul id="leaderboard"></ul>
    </div>

    <div class="game-info">
      <div class="info-item">
        <span class="info-icon">🎯</span>
        <span class="info-text">Guess the secret number</span>
      </div>
      <div class="info-item">
        <span class="info-icon">⚡</span>
        <span class="info-text">Fewer attempts = Higher score</span>
      </div>
      <div class="info-item">
        <span class="info-icon">🏆</span>
        <span class="info-text">Can you get a perfect 100?</span>
      </div>
    </div>

    <footer class="footer-main">
      © 2026 MindHunt - A Brain Teaser | Built by Aditya
    </footer>
  </main>
  <script src="GuessGame.js"></script>
</body>
</html>
