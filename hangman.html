<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🪢 Hangman — BrainArcade</title>
  <link rel="stylesheet" href="BrainArcade.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body class="game-body">
  <div class="noise-overlay"></div>
  <div class="grid-bg"></div>
  <div id="hm-toast"></div>

  <!-- Result Overlay -->
  <div class="result-overlay" id="hm-result-overlay">
    <div class="result-card">
      <div class="result-emoji" id="res-emoji">
        <div class="gift-blast-wrap" id="gift-blast-wrap">
          <canvas id="burst-canvas"></canvas>
          <div class="gift-icon-ring" id="gift-icon-ring">
            <i class="bi bi-gift-fill gift-icon" id="gift-icon"></i>
          </div>
        </div>
      </div>
      <div class="result-title" id="res-title">You Won!</div>
      <div class="result-word" id="res-word">The word was <span id="res-word-val">—</span></div>
      <div class="hm-play-again">
        <button class="btn-teal" onclick="hmNewGame()"><i class="bi bi-arrow-repeat"></i> Play Again</button>
        <button class="btn-coral hm-back" onclick="window.location.href='index.html'"><i class="bi bi-arrow-left"></i> Home</button>
      </div>
    </div>
  </div>

  <nav class="game-topbar">
    <button class="back-btn" onclick="window.location.href='index.html'">
      <i class="bi bi-arrow-left"></i> <span>Back</span>
    </button>
    <div class="topbar-game-title hangman-coral">🪢 Hangman</div>
    <div class="topbar-right">
      <span class="hangman-text">BrainArcade</span>
    </div>
  </nav>

  <div class="hm-wrap">
    <h1 class="hm-title">Hangman</h1>
    <p class="hm-sub">One Wrong letter at a time.</p>

    <!-- Stats -->
    <div class="hm-stats stats-hangman">
      <div class="stat-box">
        <div class="stat-box-label">Wins</div>
        <div class="stat-box-val hangman-teal" id="hm-wins">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Losses</div>
        <div class="stat-box-val hangman-coral" id="hm-losses">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Streak</div>
        <div class="stat-box-val" id="hm-streak">0</div>
      </div>
    </div>

    <div class="hm-layout">
      <!-- Left: Gallows -->
      <div class="hm-gallows-panel">
        <svg id="gallows-svg" viewBox="0 0 120 160" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Static structure -->
          <line x1="10" y1="155" x2="110" y2="155" stroke="#3a3f50" stroke-width="4" stroke-linecap="round"/>
          <line x1="30" y1="155" x2="30" y2="10" stroke="#3a3f50" stroke-width="4" stroke-linecap="round"/>
          <line x1="30" y1="10" x2="75" y2="10" stroke="#3a3f50" stroke-width="4" stroke-linecap="round"/>
          <line x1="75" y1="10" x2="75" y2="28" stroke="#3a3f50" stroke-width="4" stroke-linecap="round"/>
          <!-- Body parts (hidden initially) -->
          <circle id="hm-head" cx="75" cy="38" r="10" stroke="#ff5f5f" stroke-width="3" opacity="0"/>
          <line id="hm-body" x1="75" y1="48" x2="75" y2="90" stroke="#ff5f5f" stroke-width="3" stroke-linecap="round" opacity="0"/>
          <line id="hm-larm" x1="75" y1="60" x2="55" y2="78" stroke="#ff5f5f" stroke-width="3" stroke-linecap="round" opacity="0"/>
          <line id="hm-rarm" x1="75" y1="60" x2="95" y2="78" stroke="#ff5f5f" stroke-width="3" stroke-linecap="round" opacity="0"/>
          <line id="hm-lleg" x1="75" y1="90" x2="55" y2="115" stroke="#ff5f5f" stroke-width="3" stroke-linecap="round" opacity="0"/>
          <line id="hm-rleg" x1="75" y1="90" x2="95" y2="115" stroke="#ff5f5f" stroke-width="3" stroke-linecap="round" opacity="0"/>
        </svg>

        <div class="lives-row" id="hm-hearts">
          <span class="heart">❤️</span>
          <span class="heart">❤️</span>
          <span class="heart">❤️</span>
          <span class="heart">❤️</span>
          <span class="heart">❤️</span>
          <span class="heart">❤️</span>
        </div>

        <div class="hm-cate">
          <div class="panel-label hangman-category">Category</div>
          <div class="hm-category" id="hm-category-label">—</div>
        </div>
      </div>

      <!-- Right: Word + Keyboard -->
      <div class="hm-main-col">
        <div class="panel">
          <div class="panel-label">Guess the Word</div>
          <div class="word-display" id="hm-word-display"></div>
        </div>

        <div class="panel">
          <div class="panel-label">Choose a letter</div>
          <div class="keyboard" id="hm-keyboard"></div>
        </div>

        <div class="mh-actions">
          <button class="btn-coral" onclick="hmNewGame()"><i class="bi bi-arrow-repeat"></i> New Word</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="hangman.js"></script>
</body>
</html>
